version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fintech-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fintech_db
      MYSQL_ROOT_PASSWORD: rootpassword
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0
    container_name: fintech-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: